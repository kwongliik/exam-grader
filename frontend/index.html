<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Exam Grader</title>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
  label { display: block; margin-top: 12px; font-weight: bold; }
  textarea, input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
  button { margin-top: 16px; padding: 10px 20px; cursor: pointer; }
  #result { margin-top: 24px; padding: 16px; background: #f4f4f4; border-radius: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
  <h1>Exam Grader (MVP)</h1>
  <form id="gradeForm">
    <label>Student ID</label>
    <input type="text" id="student_id" required />

    <label>Question ID</label>
    <input type="text" id="question_id" required />

    <label>Question Text</label>
    <textarea id="question_text" rows="2" required></textarea>

    <label>Marking Scheme</label>
    <textarea id="marking_scheme" rows="3" required></textarea>

    <label>Max Score</label>
    <input type="number" id="max_score" step="0.5" required />

    <label>Photo of Handwritten Answer</label>
    <input type="file" id="image" accept="image/*" required />

    <button type="submit">Grade</button>
  </form>

  <div id="result"></div>

  <script>
    // Change this to your deployed backend URL once Step 6 is done.
    const API_URL = "http://localhost:8000/grade";

    document.getElementById("gradeForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const resultDiv = document.getElementById("result");
      resultDiv.textContent = "Grading...";

      const formData = new FormData();
      formData.append("student_id", document.getElementById("student_id").value);
      formData.append("question_id", document.getElementById("question_id").value);
      formData.append("question_text", document.getElementById("question_text").value);
      formData.append("marking_scheme", document.getElementById("marking_scheme").value);
      formData.append("max_score", document.getElementById("max_score").value);
      formData.append("image", document.getElementById("image").files[0]);

      try {
        const res = await fetch(API_URL, { method: "POST", body: formData });
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        resultDiv.textContent =
          `Score: ${data.score} / ${data.max_score}\n\n` +
          `Transcribed answer:\n${data.extracted_answer}\n\n` +
          `Feedback:\n${data.feedback}`;
      } catch (err) {
        resultDiv.textContent = "Error: " + err.message;
      }
    });
  </script>
</body>
</html>
